<script>

  /* =========================
     GLOBAL ACCESS PASSWORD
     ========================= */
  const GLOBAL_PASSWORD = "ENTER123";

 /* =========================
      PAPERS
     ========================= */
  const papers = window.questionPapers;

  /* =========================
     TIMER SETTINGS
     ========================= */
  const totalTime = 60;
  let timeLeft, timer, questions;

  function checkAccess() {
    const pass = document.getElementById('accessPassword').value;
    const validPasswords = [GLOBAL_PASSWORD, "123"];
    if (validPasswords.includes(pass)) {
      document.getElementById('mainLogin').style.display = 'none';
      document.getElementById('mainHome').style.display = 'flex';
      loadPapers();
    } else {
      document.getElementById('loginError').innerText = 'Invalid password';
    }
  }
  
  

  function loadPapers() {
    const select = document.getElementById('paperSelect');
    select.innerHTML = '';
    Object.keys(papers).forEach(p => {
      select.innerHTML += `<option value="${p}">${p}</option>`;
    });
  }

 function startTest() {
  const paperName = document.getElementById('paperSelect').value; 
  const entered = document.getElementById('paperPassword').value;

  if (!paperName) {
    document.getElementById('paperError').innerText = 'Please select a paper';
    return;
  }

  if (entered !== papers[paperName].password) {
    document.getElementById('paperError').innerText = 'Wrong paper password';
    return;
  }

    questions = papers[paperName].questions;
    timeLeft = totalTime * 60;
    document.getElementById('home').style.display = 'none';
    document.getElementById('quiz').style.display = 'block';
    loadQuestions();
    startTimer();
  }

  function loadQuestions() {
    const form = document.getElementById('quizForm');
    form.innerHTML = '';
    questions.forEach((q, i) => {
      let html = `<div class="question"><p>${i + 1}. ${q.question}</p>`;
      q.options.forEach(opt => {
        html += `<label><input type="radio" name="q${i}" value="${opt}"> ${opt}</label><br>`;
      });
      html += `</div>`;
      form.innerHTML += html;
    });
  }

  function startTimer() {
    updateTime();
    timer = setInterval(() => {
      timeLeft--;
      updateTime();
      if (timeLeft <= 0) submitTest();
    }, 1000);
  }

  function updateTime() {
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    document.getElementById('time').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  function submitTest() {
  if (!timer) return;
  clearInterval(timer);
  timer = null;
    let score = 0, review = '';
    questions.forEach((q, i) => {
      const sel = document.querySelector(`input[name="q${i}"]:checked`);
      const ans = sel ? sel.value : 'Not Answered';
      if (ans === q.answer) score++;
      review += `<p><b>Q${i + 1}:</b> ${q.question}<br>`;
      review += `Your Answer: <span class="${ans === q.answer ? 'correct' : 'wrong'}">${ans}</span><br>`;
      review += `Correct Answer: <span class="correct">${q.answer}</span></p>`;
    });
    document.getElementById('quiz').style.display = 'none';
    document.getElementById('result').style.display = 'block';
    document.getElementById('scoreText').innerHTML = `<b>Score:</b> ${score} / ${questions.length}`;
    document.getElementById('answerReview').innerHTML = review;
  }

  function exitToHome() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('home').style.display = 'none';
  document.getElementById('mainHome').style.display = 'flex';
}

function backToMainHome() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('mainHome').style.display = 'flex';
}


  function openPapers() {
  document.getElementById('mainHome').style.display = 'none';
  document.getElementById('home').style.display = 'block';
  loadPapers();
 }

 function showTopics() {
  document.getElementById('homeContent').innerHTML = `

  `;
 }


                                                            
 function showAbout() {

  `;
 }

          <button class="sp-chip" onclick="spSelectTime(this,300)">5 min</button>

  if (!document.getElementById('spStyles')) {

      .sp-opt { padding:14px;border:1px solid #ddd;border-radius:8px;background:white;font-size:15px;cursor:pointer;transition:0.2s;text-align:center; }
      .sp-opt:hover:not(:disabled) { background:#eaf4fd;border-color:#3498db; }
      .sp-opt.correct { background:#eafaf1;border-color:#27ae60;color:#27ae60;font-weight:bold; }
      .sp-opt.wrong { background:#fdedec;border-color:#e74c3c;color:#e74c3c; }
    `;
    document.head.appendChild(s);
  }

  spSelectedSubject = '';
  spSelectedTime = 0;
}

let spSelectedSubject = '', spSelectedTime = 0;
let spTimerInterval = null, spTimeLeft = 0;
let spScore = 0, spAttempted = 0, spCurrentAnswer = null, spAnswered = false;
let spPhysicsPool = [];

function spSelectTime(el, secs) {
  document.querySelectorAll('.sp-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  spSelectedTime = secs;
  spCheckReady();
}

function spCheckReady() {
  spSelectedSubject = document.getElementById('spSubject').value;
  const btn = document.getElementById('spStartBtn');
  btn.disabled = !(spSelectedSubject && spSelectedTime);
  btn.style.opacity = btn.disabled ? '0.5' : '1';
}

function spStartQuiz() {
  spScore = 0; spAttempted = 0; spPhysicsPool = [];
  spTimeLeft = spSelectedTime;
  document.getElementById('sp-select').style.display = 'none';
  document.getElementById('sp-quiz').style.display = 'block';
  document.getElementById('sp-result').style.display = 'none';
  document.getElementById('spBadge').textContent = spSelectedSubject === 'math' ? 'Mathematics' : 'Physics Formulas';
  spUpdateTimer();
  spLoadQuestion();
  spTimerInterval = setInterval(() => {
    spTimeLeft--;
    spUpdateTimer();
    if (spTimeLeft <= 0) { clearInterval(spTimerInterval); spShowResults(); }
  }, 1000);
}

function spUpdateTimer() {
  const m = Math.floor(spTimeLeft / 60);
  const s = spTimeLeft % 60;
  const el = document.getElementById('spTimer');
  el.textContent = `${m}:${String(s).padStart(2,'0')}`;
  el.style.color = spTimeLeft <= 10 ? '#e74c3c' : '#27ae60';
}

function spLoadQuestion() {
  spAnswered = false;
  const q = spSelectedSubject === 'math' ? spGenMath() : spGetPhysics();
  spCurrentAnswer = q.answer;
  document.getElementById('spQNum').textContent = `Question ${spAttempted + 1}`;
  document.getElementById('spQText').textContent = q.question;
  const pct = ((spSelectedTime - spTimeLeft) / spSelectedTime) * 100;
  document.getElementById('spProgress').style.width = pct + '%';
  const grid = document.getElementById('spOptions');
  grid.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'sp-opt';
    btn.textContent = opt;
    btn.onclick = () => spHandleAnswer(opt, btn);
    grid.appendChild(btn);
  });
}

function spHandleAnswer(chosen, btn) {
  if (spAnswered) return;
  spAnswered = true; spAttempted++;
  document.querySelectorAll('.sp-opt').forEach(b => {
    b.disabled = true;
    if (b.textContent == spCurrentAnswer) b.classList.add('correct');
  });
  if (chosen == spCurrentAnswer) { spScore++; btn.classList.add('correct'); }
  else btn.classList.add('wrong');
  setTimeout(() => { if (spTimeLeft > 0) spLoadQuestion(); }, 900);
}

function spShowResults() {
  clearInterval(spTimerInterval);
  document.getElementById('sp-quiz').style.display = 'none';
  document.getElementById('sp-result').style.display = 'block';
  const acc = spAttempted > 0 ? Math.round((spScore / spAttempted) * 100) : 0;
  document.getElementById('spScore').textContent = `${spScore} / ${spAttempted}`;
  document.getElementById('spDetail').textContent = `Questions attempted: ${spAttempted}`;
  document.getElementById('spAccuracy').textContent = `Accuracy: ${acc}%`;
  let grade = 'Keep Practicing! 💪';
  if (acc >= 90) grade = 'Outstanding! 🌟';
  else if (acc >= 75) grade = 'Great Work! 🎯';
  else if (acc >= 50) grade = 'Good Effort! 👍';
  document.getElementById('spGrade').textContent = grade;
}

function spGoHome() {

}

/* ---- MATH GENERATOR ---- */
function spGenMath() {
  const type = Math.floor(Math.random() * 8);
  let q, answer;
  if (type === 0) { const a=Math.floor(Math.random()*900)+100,b=Math.floor(Math.random()*900)+100; q=`${a} + ${b} = ?`; answer=a+b; }
  else if (type===1) { const a=Math.floor(Math.random()*500)+100,b=Math.floor(Math.random()*(a-1))+1; q=`${a} − ${b} = ?`; answer=a-b; }
  else if (type===2) { const a=Math.floor(Math.random()*19)+2,b=Math.floor(Math.random()*19)+2; q=`${a} × ${b} = ?`; answer=a*b; }
  else if (type===3) { const a=Math.floor(Math.random()*20)+2; q=`${a}² = ?`; answer=a*a; }
  else if (type===4) { const p=[10,15,20,25,50][Math.floor(Math.random()*5)],n=[100,200,300,400,500][Math.floor(Math.random()*5)]; q=`${p}% of ${n} = ?`; answer=(p/100)*n; }
  else if (type===5) { const pairs=[[6,2],[12,4],[15,3],[20,5],[24,6],[36,9],[48,8],[50,10]]; const [a,b]=pairs[Math.floor(Math.random()*pairs.length)]; q=`${a} ÷ ${b} = ?`; answer=a/b; }
  else if (type===6) { const a=Math.floor(Math.random()*15)+2; q=`√${a*a} = ?`; answer=a; }
  else { const a=Math.floor(Math.random()*12)+2,b=Math.floor(Math.random()*12)+2,c=Math.floor(Math.random()*20)+5; q=`${a} × ${b} + ${c} = ?`; answer=a*b+c; }
  return { question:q, options:spNumOptions(answer), answer };
}

function spNumOptions(correct) {
  const set = new Set([correct]);
  const d = [-13,-7,-5,3,5,7,10,13,15,20];
  let tries=0;
  while (set.size<4 && tries<50) { const w=correct+d[Math.floor(Math.random()*d.length)]; if(w>0) set.add(w); tries++; }
  while (set.size<4) set.add(correct+set.size*7);
  return spShuffle([...set]);
}

function spShuffle(arr) {
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

const canvas = document.getElementById("introCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
let centerX = canvas.width / 2;
let centerY = canvas.height / 2;
let explode = false;
let explosionRadius = 0;

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (centerX - this.x) * 0.006;
        this.speedY = (centerY - this.y) * 0.006;
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (!explode && Math.hypot(this.x - centerX, this.y - centerY) < 6) {
            explode = true;

            setTimeout(() => {
                showMainLogin();
            }, 1200);
        }
    }

    draw() {
        ctx.fillStyle = "rgba(180,180,180,0.8)";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

for (let i = 0; i < 400; i++) {
    particles.push(new Particle());
}

function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (!explode) {
        particles.forEach(p => {
            p.update();
            p.draw();
        });
    } else {
        explosionRadius += 4;

        ctx.beginPath();
        ctx.arc(centerX, centerY, explosionRadius, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(80,80,80,0.5)";
        ctx.lineWidth = 6;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
        ctx.fillStyle = "black";
        ctx.fill();
    }

    requestAnimationFrame(animate);
}

function showMainLogin() {
    // fade out animation
    canvas.style.transition = "opacity 0.8s";
    canvas.style.opacity = "0";

    setTimeout(() => {
        // hide animation
        canvas.style.display = "none";

        // hide "Welcome" text
        document.getElementById("introLogin").style.display = "none";

        // show actual login
        document.getElementById("mainLogin").style.display = "block";
    }, 800);
}

animate();
